# Central configuration for the Traffic Incident & Congestion Intelligence pipeline.
seed: 42

data:
  n_days: 365                 # simulated observation window
  n_segments: 60              # road segments in the city network
  start_date: "2024-01-01"
  incident_rate: 0.035        # base probability of an incident per segment-hour
  raw_dir: "data/raw"
  processed_dir: "data/processed"

warehouse:
  path: "data/warehouse/traffic_dw.db"

preprocess:
  congestion_bins: [0.0, 0.35, 0.60, 0.80, 1.01]
  congestion_labels: ["Free flow", "Light", "Moderate", "Severe"]
  outlier_z: 4.0

mining:
  test_size: 0.25
  classification_models: ["decision_tree", "random_forest", "naive_bayes", "logistic_regression"]
  clustering_k_range: [2, 3, 4, 5, 6, 7, 8]
  apriori:
    min_support: 0.05
    min_confidence: 0.55
    min_lift: 1.10
    max_itemset_size: 3
  forecast:
    horizon_hours: 168        # one week ahead
    lags: [1, 2, 3, 24, 168]

reports:
  dir: "reports"
  figures_dir: "reports/figures"
